<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <header>
    <h1>Inscrições abertas do evento!</h1>
    <p>Olá! caso você tenha interesse em participar do nosso evento, preencha esses campos e resgate seu ingresso!</p>
    </header>
    <main>
        <form action="" method="post">
            <label for="nome">Nome:</label>
            <input type="text" name="nome"
            placeholder="Digite seu nome: " id="nome" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            <br>
            <label for="tel">Telefone:</label>
            <input type="tel" name="telefone" id="tel" placeholder="(**) * ****-****" pattern="\(\d{2}\)\s?\d{4,5}-\d{4}" required>
            <br>
            <label for="data">Data de Nascimento:</label>
            <input type="date" name="data" id="data" required>
            <br>
            <label for="ingresso">Tipo de Ingresso:</label>
            <select name="ingresso" id="ingresso" required>
                <option value="">Selecione</option>
                <option value="vip">VIP</option>
                <option value="regular">Regular</option>
                <option value="estudante">Estudante</option>
            </select>
            <br>
            <label for="quantidade">Quantidade de ingressos:</label>
            <input type="number" name="num_ingressos" id="quantidade" min="1"  max="5" required>
            <br>

            <fieldset>
            <legend>Interesses do Usuário</legend>

            <label for="interesse1">Seus interesses:</label>
            <br>
            <input type="checkbox" id="interesse1" name="interesse" value="musica" > Música
            <br>
            <label for="interesse2"></label>
            <input type="checkbox" value="jogos" name="interesse" id="interesse2"> Jogos
            <br>
            <label for="interesse3"></label>
            <input type="checkbox" value="danca" name="interesse" id="interesse3"> Dança
            <br>
            <label for="interesse4"></label>
            <input type="checkbox" value="esporte" name="interesse" id="interesse4"> Esportes
            <br>
            <label for="interesse5"></label>
            <input type="checkbox" value="academico" name="interesse" id="interesse5"> Estudos
            </fieldset>

            <br>
            <label for="adicionais">Comentários Adicionais</label>
            <br>
            <textarea name="comentarios" id="adicionais" cols="30" rows="10" maxlength="300" placeholder="Faça comentários adicionais:"></textarea>
            <br>
            <button type="submit">Enviar Formulário</button>
            <button type="reset">Limpar Formulário</button>
        </form>
    </main>
</body>
</html>
